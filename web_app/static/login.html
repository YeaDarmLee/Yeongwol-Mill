<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 영월고향방앗간</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            max-width: 420px;
            margin: 140px auto 8rem;
            padding: var(--space-8) var(--space-6);
            background: var(--color-surface);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--color-border-subtle);
            text-align: center;
        }

        .auth-title {
            font-family: var(--font-heading);
            font-size: 2rem;
            margin-bottom: var(--space-2);
            color: var(--color-text-primary);
        }

        .auth-subtitle {
            color: var(--color-text-muted);
            font-size: 0.95rem;
            margin-bottom: var(--space-6);
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
            color: var(--color-text-primary);
        }

        .btn-auth {
            width: 100%;
            padding: 1rem;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1rem;
            transition: transform var(--motion-fast) var(--ease-standard), background-color var(--motion-fast) var(--ease-standard), box-shadow var(--motion-fast) var(--ease-standard);
        }

        @media (hover: hover) and (pointer: fine) {
            .btn-auth:hover {
                background-color: var(--color-primary-hover);
                transform: translateY(-1px);
                box-shadow: var(--shadow-sm);
            }
        }

        .btn-auth:active {
            transform: translateY(0) scale(0.98);
        }

        .auth-links {
            margin-top: 1.5rem;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .auth-links a {
            color: var(--color-text-secondary);
            text-decoration: none;
            transition: color var(--motion-fast) var(--ease-standard);
        }

        .auth-links a:hover {
            color: var(--color-primary);
        }

        /* 비밀번호 찾기 모달 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: all 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .modal-card {
            background: #ffffff;
            width: 90%;
            max-width: 440px;
            padding: 2rem 1.6rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border: 1px solid var(--color-border-subtle, #eaeaea);
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #222;
            margin-bottom: 0.8rem;
        }

        .modal-subtitle {
            font-size: 0.88rem;
            color: #666;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .form-control::placeholder {
            color: #b8b2aa !important;
            opacity: 0.6 !important;
            font-weight: 400 !important;
        }
    </style>
</head>

<body>
    <header>
        <div class="nav-overlay"></div>
        <a href="/" class="logo">영월고향방앗간</a>
        <div class="nav-container">
            <nav class="gnb">
                <a href="/">홈</a>
                <a href="/brand">브랜드 소개</a>
                <a href="/process">생산과정</a>
                <a href="/category">상품보기</a>
            </nav>
            <div class="utility">
                <a href="/login">로그인</a>
                <a href="/order-history">주문조회</a>
                <a href="/cart" id="cart-nav">장바구니 (0)</a>
            </div>
        </div>
    </header>

    <main class="auth-container">
        <h1 class="auth-title">영월고향방앗간</h1>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>이메일 주소</label>
                <input type="email" id="loginEmail" class="form-control" placeholder="예: email@yeongwol.com" required>
            </div>

            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="비밀번호 입력" required>
            </div>

            <button type="submit" class="btn-auth">로그인</button>
        </form>

        <div class="auth-links">
            <a href="/register" style="color:var(--color-primary,#915a28); font-weight:600;">회원가입</a>
            <a href="#" onclick="openResetModal(event)">비밀번호 찾기</a>
        </div>
    </main>

    <!-- 모달: 비밀번호 찾기 (OWASP 이메일 링크 전송 방식) -->
    <div id="resetModal" class="modal-overlay">
        <div class="modal-card">
            <h3 class="modal-title">비밀번호 찾기</h3>
            <p class="modal-subtitle">가입 시 등록하신 이메일 주소와 휴대폰 번호를 입력해 주시면 안전한 비밀번호 재설정 링크를 보내드립니다.</p>

            <form id="formResetRequest" onsubmit="handleResetRequest(event)">
                <div class="form-group">
                    <label>등록된 이메일 주소 *</label>
                    <input type="email" id="resetEmail" class="form-control" placeholder="예: email@yeongwol.com"
                        required>
                </div>
                <div class="form-group">
                    <label>등록된 휴대폰 번호 *</label>
                    <input type="tel" id="resetPhone" class="form-control" placeholder="예: 010-1234-5678" required>
                </div>
                <div style="display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem;">
                    <button type="button" class="header-btn" onclick="closeResetModal()">취소</button>
                    <button type="submit" class="btn-auth"
                        style="margin-top:0; width:auto; padding:0.6rem 1.4rem; font-size:0.95rem;">재설정 링크 보내기</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <div class="footer-info">
                <span class="footer-logo">영월고향방앗간</span><br>
                강원특별자치도 영월군 영월읍 방앗간길 12 | 고객센터: 033-000-0000<br>
                대표자: 홍길동 | 사업자등록번호: 123-45-67890
            </div>
            <div class="footer-links">
                <a href="/terms">이용약관</a>
                <a href="/privacy">개인정보처리방침</a>
            </div>
        </div>
        <div class="copyright">&copy; 2026 영월고향방앗간. All rights reserved.</div>
    </footer>

    <script src="cart.js"></script>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            try {
                const resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await resp.json();
                if (resp.ok) {
                    localStorage.setItem('yw_jwt_token', data.token);
                    localStorage.setItem('yw_user', JSON.stringify(data.user));
                    window.location.href = '/';
                } else {
                    customAlert(data.error || '로그인 실패', 'error');
                }
            } catch (err) {
                console.error(err);
                customAlert('로그인 처리 중 오류가 발생했습니다.', 'error');
            }
        }

        function openResetModal(e) {
            if (e) e.preventDefault();
            document.getElementById('resetEmail').value = '';
            document.getElementById('resetPhone').value = '';
            document.getElementById('resetModal').classList.add('active');
        }

        function closeResetModal() {
            document.getElementById('resetModal').classList.remove('active');
        }

        async function handleResetRequest(e) {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value.trim();
            const phone = document.getElementById('resetPhone').value.trim();

            if (!email || !phone) {
                customAlert('등록된 이메일 주소와 휴대폰 번호를 모두 입력해 주세요.', 'error');
                return;
            }

            try {
                const resp = await fetch('/api/auth/reset-password-request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, phone })
                });
                const data = await resp.json();

                if (resp.ok) {
                    closeResetModal();
                    customAlert(data.message || '비밀번호 재설정 링크가 입력하신 이메일로 성공적으로 발송되었습니다.', 'success');
                } else {
                    customAlert(data.error || '입력하신 이메일과 휴대폰 번호에 일치하는 회원 정보를 찾을 수 없습니다.', 'error');
                }
            } catch (err) {
                console.error(err);
                customAlert('재설정 요청 처리 중 오류가 발생했습니다.', 'error');
            }
        }
    </script>
</body>

</html>
