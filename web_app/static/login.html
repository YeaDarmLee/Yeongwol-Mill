<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 영월고향방앗간</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            max-width: 420px;
            margin: 5rem auto 8rem;
            padding: 2.5rem 2rem;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid #eae6df;
            text-align: center;
        }

        .auth-title {
            font-family: 'Noto Serif KR', serif;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #222;
        }

        .auth-subtitle {
            color: #777;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 0.85rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .btn-auth {
            width: 100%;
            padding: 1rem;
            background: var(--color-primary, #915a28);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1rem;
        }

        .auth-links {
            margin-top: 1.5rem;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .auth-links a {
            color: #666;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <header>
        <div class="nav-overlay"></div>
        <a href="index.html" class="logo">영월고향방앗간</a>
        <div class="nav-container">
            <nav class="gnb">
                <a href="index.html">홈</a>
                <a href="brand.html">브랜드 소개</a>
                <a href="process.html">생산과정</a>
                <a href="category.html">상품보기</a>
            </nav>
            <div class="utility">
                <a href="login.html">로그인</a>
                <a href="order-history.html">주문조회</a>
                <a href="cart.html" id="cart-nav">장바구니 (0)</a>
            </div>
        </div>
    </header>

    <main class="auth-container">
        <h1 class="auth-title">영월고향방앗간</h1>
        <p class="auth-subtitle">JWT 보안 로그인</p>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>이메일 주소</label>
                <input type="email" id="loginEmail" class="form-control" placeholder="example@email.com" required>
            </div>

            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="비밀번호 입력" required>
            </div>

            <button type="submit" class="btn-auth">로그인</button>
        </form>

        <div class="auth-links">
            <a href="register.html" style="color:var(--color-primary,#915a28); font-weight:600;">회원가입</a>
            <a href="order-history.html">비회원 주문조회</a>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-info">
                <span class="footer-logo">영월고향방앗간</span><br>
                강원도 영월군 영월읍 방앗간길 123 | 고객센터: 1588-0000
            </div>
        </div>
        <div class="copyright">&copy; 2026 영월고향방앗간. All rights reserved.</div>
    </footer>

    <script src="cart.js"></script>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            try {
                const resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await resp.json();
                if (resp.ok) {
                    localStorage.setItem('yw_jwt_token', data.token);
                    localStorage.setItem('yw_user', JSON.stringify(data.user));
                    alert(`${data.user.name}님, 환영합니다!`);
                    window.location.href = 'index.html';
                } else {
                    alert(data.error || '로그인 실패');
                }
            } catch (err) {
                console.error(err);
                alert('로그인 처리 중 오류가 발생했습니다.');
            }
        }
    </script>
</body>
</html>
