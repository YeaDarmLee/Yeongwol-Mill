<!-- 2단계 환불 확인 모달 -->
<div id="adminRefundConfirmModal" class="modal-overlay" style="z-index: 2050;">
    <div class="modal-card" style="max-width: 520px; border:2px solid #d32f2f;">
        <h3 style="font-family:'Noto Serif KR', serif; margin-top:0; color:#c62828;">2단계 환불 승인 확인</h3>
        <input type="hidden" id="refund-target-order-id">
        <div id="refund-preview-body" style="font-size:0.9rem; line-height:1.6; background:#fff8f8; padding:12px 16px; border-radius:8px; border:1px solid #ffcdd2; margin-bottom:1.2rem;">
            <p>환불 예상 금액을 계산 중입니다...</p>
        </div>
        <div class="form-group">
            <label style="font-weight:600; color:#c62828;">환불 사유 선택 / 입력</label>
            <select id="refund-reason-code" class="form-control" style="margin-bottom:8px;">
                <option value="CUSTOMER_REQUEST">고객변심 / 요청</option>
                <option value="OUT_OF_STOCK">재고부족 / 품절</option>
                <option value="SHIPPING_DELAY">배송지연</option>
                <option value="DEFECTIVE_PRODUCT">상품하자 / 이물질</option>
                <option value="ADMIN_MANUAL">관리자 직권 취소</option>
            </select>
            <input type="text" id="refund-reason-custom" class="form-control" placeholder="상세 사유 입력 (선택사항)">
        </div>
        <div style="font-size:0.78rem; color:#d32f2f; margin-bottom:1.2rem;">
            환불 실행 시 PortOne PG 취소 및 상품 재고 복구가 즉시 진행되며, 취소된 결제는 복구할 수 없습니다.
        </div>
        <div style="text-align:right; gap:8px; display:flex; justify-content:flex-end;">
            <button onclick="closeModal('adminRefundConfirmModal')" class="btn-action">취소</button>
            <button onclick="executeFinalAdminRefund(this)" class="btn-action" style="background:#c62828; color:#fff;">최종 환불 승인 실행</button>
        </div>
    </div>
</div>
