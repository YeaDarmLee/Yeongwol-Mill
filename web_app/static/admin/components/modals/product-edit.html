<!-- 상품 및 재고 수정 모달 -->
<div id="editProductModal" class="modal-overlay">
    <div class="modal-card" style="max-width:980px; width:92%;">
        <h3 style="font-family:'Noto Serif KR', serif; margin-top:0;">상품 및 옵션 재고 수정</h3>
        <input type="hidden" id="edit-prod-id">
        <div class="form-group">
            <label>상품명</label>
            <input type="text" id="edit-prod-name" class="form-control" required>
        </div>
        <div class="form-group" style="display:flex; gap:12px;">
            <div style="flex:1;">
                <label>카테고리</label>
                <select id="edit-prod-category" class="form-control">
                    <option value="1">참기름 (1)</option>
                    <option value="2">들기름 (2)</option>
                    <option value="3">고춧가루 (3)</option>
                    <option value="4">선물세트 (4)</option>
                </select>
            </div>
            <div style="flex:1;">
                <label>기본 판매가(원)</label>
                <input type="number" id="edit-prod-price" class="form-control" required>
            </div>
            <div style="flex:1;">
                <label>판매 여부</label>
                <select id="edit-prod-active" class="form-control">
                    <option value="1">판매중</option>
                    <option value="0">판매중지</option>
                </select>
            </div>
        </div>
        <div class="form-group" style="display:flex; gap:12px;">
            <div style="flex:1;">
                <label>용량/규격</label>
                <input type="text" id="edit-prod-capacity" class="form-control">
            </div>
            <div style="flex:2;">
                <label>상품 간단 설명</label>
                <input type="text" id="edit-prod-description" class="form-control">
            </div>
        </div>

        <hr style="border:none; border-top:1px solid #eee; margin:1.2rem 0;">
        <h4 style="font-family:'Noto Serif KR', serif; margin:0 0 0.6rem 0; font-size:1.05rem;">식품 상품정보제공고시</h4>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; background:#faf8f5; padding:12px; border-radius:8px; border:1px solid #ebe6df;">
            <div class="form-group" style="margin-bottom:0;">
                <label style="font-size:0.75rem; color:#555;">식품의 유형</label>
                <input type="text" id="edit-prod-foodtype" class="form-control" style="padding:6px 10px;">
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label style="font-size:0.75rem; color:#555;">생산자 및 소재지</label>
                <input type="text" id="edit-prod-manufacturer" class="form-control" style="padding:6px 10px;">
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label style="font-size:0.75rem; color:#555;">제조연월일 및 소비기한</label>
                <input type="text" id="edit-prod-shelflife" class="form-control" style="padding:6px 10px;">
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label style="font-size:0.75rem; color:#555;">포장단위별 내용물의 용량</label>
                <input type="text" id="edit-prod-contentscap" class="form-control" style="padding:6px 10px;">
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label style="font-size:0.75rem; color:#555;">원재료명 및 원산지</label>
                <input type="text" id="edit-prod-origin" class="form-control" style="padding:6px 10px;">
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label style="font-size:0.75rem; color:#555;">소비자상담 관련 전화번호</label>
                <input type="text" id="edit-prod-csphone" class="form-control" style="padding:6px 10px;">
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label style="font-size:0.75rem; color:#555;">보관방법 또는 취급방법</label>
                <input type="text" id="edit-prod-storage" class="form-control" style="padding:6px 10px;">
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label style="font-size:0.75rem; color:#555;">알레르기 유발물질</label>
                <input type="text" id="edit-prod-allergy" class="form-control" style="padding:6px 10px;">
            </div>
        </div>

        <hr style="border:none; border-top:1px solid #eee; margin:1.2rem 0;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.6rem;">
            <h4 style="font-family:'Noto Serif KR', serif; margin:0;">상품 옵션 및 재고(stock) 구성</h4>
            <button type="button" class="btn-action" style="background:#2e7d32; color:#fff;" onclick="addEditOptionRow()">+ 옵션 추가</button>
        </div>
        <div id="edit-prod-options-container" style="display:flex; flex-direction:column; gap:10px;">
            <!-- JS 동적 생성 -->
        </div>

        <div style="text-align:right; gap:8px; display:flex; justify-content:flex-end; margin-top:1.5rem;">
            <button onclick="closeModal('editProductModal')" class="btn-action">취소</button>
            <button onclick="submitEditProduct(this)" class="btn-action" style="background:var(--admin-primary); color:#fff;">수정 사항 저장</button>
        </div>
    </div>
</div>
