<!-- 1. 관리자 로그인 폼 -->
<div id="login-section" class="login-wrapper">
    <h2 style="font-family:'Noto Serif KR', serif;">영월고향방앗간</h2>
    <p style="font-size:0.9rem; color:#777; margin-bottom:1.5rem;">통합 관리자 시스템 로그인</p>
    <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
        <div class="form-group">
            <label>관리자 이메일</label>
            <input type="email" id="admin-email" class="form-control" placeholder="admin@example.com" required>
        </div>
        <div class="form-group">
            <label>비밀번호</label>
            <input type="password" id="admin-password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-admin">로그인</button>
    </form>
</div>
