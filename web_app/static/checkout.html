<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문/결제 - 영월고향방앗간</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Portone SDK V2 -->
    <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
    <!-- Kakao Daum Postcode SDK -->
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <style>
        .checkout-container {
            max-width: 1000px;
            margin: 3rem auto 6rem;
            padding: 0 5%;
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 3rem;
        }

        .checkout-section {
            background: #fff;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            border: 1px solid #f0ede8;
            margin-bottom: 2rem;
        }

        .section-title {
            font-family: 'Noto Serif KR', serif;
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 2px solid var(--color-primary, #915a28);
            color: #222;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.4rem;
            font-size: 0.95rem;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .checkout-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 0;
            border-bottom: 1px solid #eee;
        }

        .payment-summary {
            background: #fdfaf6;
            border: 1px solid #e8dfd3;
            border-radius: 12px;
            padding: 2rem;
            position: sticky;
            top: 2rem;
        }

        .btn-pay {
            width: 100%;
            padding: 1.2rem;
            background: var(--color-primary, #915a28);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: background 0.2s;
        }

        .btn-pay:hover {
            background: #7a4a1f;
        }

        .btn-postcode {
            padding: 0.8rem 1.2rem;
            background: #4a3e3d;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="nav-overlay"></div>
        <a href="/" class="logo">영월고향방앗간</a>
        <div class="nav-container">
            <nav class="gnb">
                <a href="/">홈</a>
                <a href="/brand">방앗간 소개</a>
                <a href="/process">착유 공정</a>
                <a href="/category">전체 상품</a>
            </nav>
            <div class="utility">
                <a href="/login">로그인</a>
                <a href="/order-history">주문조회</a>
                <a href="/cart" id="cart-nav">장바구니 (0)</a>
            </div>
        </div>
    </header>

    <div style="text-align: center; padding-top: 120px;">
        <h1 style="font-family: 'Noto Serif KR', serif; font-size: 2.2rem;">주문 / 결제</h1>
    </div>

    <main class="checkout-container">
        <!-- 좌측: 배송 정보 및 비회원/회원 정보 입력 -->
        <div>
            <!-- 비회원 주문조회 정보 (비로그인 시만 출력) -->
            <div class="checkout-section" id="guestSection">
                <h2 class="section-title">주문자 정보 (비회원)</h2>
                <div class="form-group">
                    <label>주문자 성함 *</label>
                    <input type="text" id="guestName" class="form-control" placeholder="성함을 입력하세요">
                </div>
                <div class="form-group">
                    <label>주문자 연락처 *</label>
                    <input type="tel" id="guestPhone" class="form-control" placeholder="010-0000-0000">
                </div>
                <div class="form-group">
                    <label>비회원 주문조회 비밀번호 *</label>
                    <input type="password" id="guestPassword" class="form-control" placeholder="조회 시 사용할 비밀번호 (4자리 이상)">
                    <small style="color: #777;">* 향후 비회원 주문 조회 시 필요합니다.</small>
                </div>
            </div>

            <!-- 배송지 정보 -->
            <div class="checkout-section">
                <h2 class="section-title">배송지 정보</h2>
                <div class="form-group">
                    <label>받는 분 성함 *</label>
                    <input type="text" id="recipientName" class="form-control" placeholder="수령인 성함">
                </div>
                <div class="form-group">
                    <label>받는 분 연락처 *</label>
                    <input type="tel" id="recipientPhone" class="form-control" placeholder="010-0000-0000">
                </div>
                <div class="form-group">
                    <label>우편번호 *</label>
                    <div style="display: flex; gap: 0.5rem;">
                        <input type="text" id="postalCode" class="form-control" placeholder="우편번호" readonly style="max-width: 150px;">
                        <button type="button" class="btn-postcode" onclick="execDaumPostcode()">우편번호 검색</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>주소 *</label>
                    <input type="text" id="address" class="form-control" placeholder="우편번호 검색을 이용해 주세요" readonly>
                </div>
                <div class="form-group">
                    <label>상세 주소</label>
                    <input type="text" id="addressDetail" class="form-control" placeholder="상세 주소 (동, 호수 등)">
                </div>
                <div class="form-group">
                    <label>배송 메모</label>
                    <input type="text" id="deliveryMemo" class="form-control" placeholder="예: 부재 시 문 앞에 놓아주세요.">
                </div>
            </div>
        </div>

        <!-- 우측: 주문 상품 내역 & 결제 버튼 -->
        <div>
            <div class="payment-summary">
                <h2 class="section-title">주문 상품 내역</h2>
                <div id="checkoutItemList" style="margin-bottom: 1.5rem;">
                    <!-- dynamic items -->
                </div>

                <div style="border-top: 1px solid #ddd; padding-top: 1rem; margin-bottom: 1.5rem;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem;">
                        <span>총 상품 금액</span>
                        <span id="subtotalAmount">0원</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem;">
                        <span>기본 배송비 (5만원 이상 무료)</span>
                        <span id="baseShippingFee">3,000원</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem;" id="remoteSurchargeRow">
                        <span>도서산간/제주 추가 배송비</span>
                        <span id="remoteSurchargeFee">0원</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; font-size:1.3rem; font-weight:700; color:#111; margin-top:1rem;">
                        <span>최종 결제 금액</span>
                        <span id="finalAmount" style="color:var(--color-primary, #915a28);">0원</span>
                    </div>
                </div>

                <button class="btn-pay" onclick="requestPayment()">Portone 결제하기</button>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-info">
                <span class="footer-logo">영월고향방앗간</span><br>
                강원특별자치도 영월군 영월읍 방앗간길 12 | 고객센터: 033-000-0000
            </div>
        </div>
        <div class="copyright">&copy; 2026 영월고향방앗간. All rights reserved.</div>
    </footer>

    <script src="cart.js"></script>
    <script>
        let checkoutItems = [];
        let subtotalAmount = 0;
        let baseShippingFee = 3000;
        let remoteSurchargeFee = 0;
        let finalAmount = 0;

        function execDaumPostcode() {
            new daum.Postcode({
                oncomplete: function(data) {
                    let addr = '';
                    if (data.userSelectedType === 'R') {
                        addr = data.roadAddress;
                    } else {
                        addr = data.jibunAddress;
                    }
                    document.getElementById('postalCode').value = data.zonecode;
                    document.getElementById('address').value = addr;
                    document.getElementById('addressDetail').focus();

                    // 도서산간 배송비 갱신 체크 (제주/도서 지역 우편번호)
                    const prefix = data.zonecode.substring(0, 2);
                    if (['63', '23', '40', '54'].includes(prefix)) {
                        remoteSurchargeFee = 3000;
                    } else {
                        remoteSurchargeFee = 0;
                    }
                    recalculateTotals();
                }
            }).open();
        }

        function recalculateTotals() {
            baseShippingFee = subtotalAmount >= 50000 ? 0 : 3000;
            finalAmount = subtotalAmount + baseShippingFee + remoteSurchargeFee;

            document.getElementById('subtotalAmount').innerText = `${Number(subtotalAmount).toLocaleString()}원`;
            document.getElementById('baseShippingFee').innerText = baseShippingFee === 0 ? '무료배송' : `${Number(baseShippingFee).toLocaleString()}원`;
            document.getElementById('remoteSurchargeFee').innerText = `${Number(remoteSurchargeFee).toLocaleString()}원`;
            document.getElementById('finalAmount').innerText = `${Number(finalAmount).toLocaleString()}원`;
        }

        function initCheckout() {
            checkoutItems = JSON.parse(localStorage.getItem('yw_checkout_items')) || [];
            if (checkoutItems.length === 0) {
                alert('주문할 상품이 없습니다.');
                window.location.href = '/category';
                return;
            }

            const user = JSON.parse(localStorage.getItem('yw_user') || 'null');
            const guestSection = document.getElementById('guestSection');

            if (user) {
                guestSection.style.display = 'none';
                document.getElementById('recipientName').value = user.name || '';
                document.getElementById('recipientPhone').value = user.phone || '';
            }

            subtotalAmount = 0;
            const container = document.getElementById('checkoutItemList');
            container.innerHTML = checkoutItems.map(item => {
                const itemTotal = item.price * item.quantity;
                subtotalAmount += itemTotal;
                return `
                    <div class="checkout-item">
                        <div>
                            <strong style="display:block;">${item.name}</strong>
                            <small style="color:#777;">${item.capacity || ''} x ${item.quantity}개</small>
                        </div>
                        <div style="font-weight:700;">${Number(itemTotal).toLocaleString()}원</div>
                    </div>
                `;
            }).join('');

            recalculateTotals();
        }

        async function requestPayment() {
            const user = JSON.parse(localStorage.getItem('yw_user') || 'null');
            const token = localStorage.getItem('yw_jwt_token');

            const recipientName = document.getElementById('recipientName').value.trim();
            const recipientPhone = document.getElementById('recipientPhone').value.trim();
            const postalCode = document.getElementById('postalCode').value.trim();
            const address = document.getElementById('address').value.trim();
            const addressDetail = document.getElementById('addressDetail').value.trim();
            const deliveryMemo = document.getElementById('deliveryMemo').value.trim();

            if (!recipientName || !recipientPhone || !address) {
                alert('수령인 성함, 연락처, 주소를 우편번호 검색을 이용해 올바르게 입력해 주세요.');
                return;
            }

            let guestName = '', guestPhone = '', guestPassword = '';
            if (!user) {
                guestName = document.getElementById('guestName').value.trim();
                guestPhone = document.getElementById('guestPhone').value.trim();
                guestPassword = document.getElementById('guestPassword').value.trim();

                if (!guestName || !guestPhone || !guestPassword) {
                    alert('비회원 주문 정보(성함, 연락처, 비밀번호 4자리 이상)를 입력해 주세요.');
                    return;
                }
            }

            const itemsPayload = checkoutItems.map(item => ({
                product_id: item.id,
                quantity: item.quantity
            }));

            try {
                const headers = { 'Content-Type': 'application/json' };
                if (token) headers['Authorization'] = `Bearer ${token}`;

                const resp = await fetch('/api/orders', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        items: itemsPayload,
                        recipient_name: recipientName,
                        recipient_phone: recipientPhone,
                        postal_code: postalCode,
                        address: address,
                        address_detail: addressDetail,
                        delivery_memo: deliveryMemo,
                        guest_name: guestName,
                        guest_phone: guestPhone,
                        guest_password: guestPassword
                    })
                });

                const result = await resp.json();
                if (!resp.ok) {
                    alert(result.error || '주문서 생성에 실패했습니다.');
                    return;
                }

                const orderNumber = result.order_number;
                const paymentId = `pay_${Date.now()}_${Math.floor(Math.random()*1000)}`;

                if (window.Portone) {
                    try {
                        await Portone.requestPayment({
                            storeId: "store-test-id",
                            channelKey: "channel-key-test",
                            paymentId: paymentId,
                            orderName: checkoutItems[0].name + (checkoutItems.length > 1 ? ` 외 ${checkoutItems.length - 1}건` : ''),
                            totalAmount: finalAmount,
                            currency: "CURRENCY_KRW",
                            payMethod: "CARD",
                            customer: {
                                fullName: user ? user.name : guestName,
                                phoneNumber: user ? user.phone : guestPhone
                            }
                        });
                    } catch (pErr) {
                        console.log("Portone SDK call:", pErr);
                    }
                }

                const verifyResp = await fetch('/api/payment/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        payment_id: paymentId,
                        order_number: orderNumber
                    })
                });

                const verifyResult = await verifyResp.json();
                if (verifyResp.ok) {
                    localStorage.removeItem('yw_cart');
                    localStorage.removeItem('yw_checkout_items');
                    if (typeof updateCartCount === 'function') updateCartCount();
                    window.location.href = `/order-complete?order_number=${orderNumber}`;
                } else {
                    alert(verifyResult.error || '결제 검증 실패');
                }

            } catch (err) {
                console.error("Order payment error:", err);
                alert("결제 처리 중 오류가 발생했습니다.");
            }
        }

        document.addEventListener('DOMContentLoaded', initCheckout);
    </script>
</body>

</html>
