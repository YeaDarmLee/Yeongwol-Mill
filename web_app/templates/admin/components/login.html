<!-- 1. 관리자 로그인 폼 -->
<div id="login-section" class="login-wrapper">
    <div style="text-align:center; margin-bottom:1rem;">
        <i class="fa-solid fa-user-shield" style="font-size:2.4rem; color:var(--admin-primary,#8D6E63);"></i>
    </div>
    <h2 style="font-family:'Noto Serif KR', serif; text-align:center;">영월고향방앗간</h2>
    <p style="font-size:0.9rem; color:#777; margin-bottom:1.5rem; text-align:center;">통합 관리자 시스템 로그인</p>
    <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
        <div class="form-group">
            <label style="display:flex; align-items:center; gap:5px;"><i class="fa-solid fa-envelope" style="color:#888;"></i> 관리자 이메일</label>
            <input type="email" id="admin-email" class="form-control" placeholder="admin@example.com" required>
        </div>
        <div class="form-group">
            <label style="display:flex; align-items:center; gap:5px;"><i class="fa-solid fa-lock" style="color:#888;"></i> 비밀번호</label>
            <input type="password" id="admin-password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-admin" style="display:flex; align-items:center; justify-content:center; gap:8px;">
            <i class="fa-solid fa-right-to-bracket"></i> 로그인
        </button>
    </form>
</div>
