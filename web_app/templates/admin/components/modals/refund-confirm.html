<!-- 2단계 취소 / 환불 처리 승인 전용 모달 -->
<div id="adminRefundConfirmModal" class="modal-overlay" style="z-index: 2050;">
    <div class="modal-card" style="max-width: 600px; border:2px solid #b84a4a; border-radius:12px;">
        <h3 id="refund-confirm-modal-title" style="font-family:'Noto Serif KR', serif; margin-top:0; color:#b84a4a; font-size:1.2rem; display:flex; align-items:center; gap:6px;">
            <i class="fa-solid fa-file-invoice-dollar"></i> 주문 취소 및 환불 처리 승인
        </h3>
        
        <input type="hidden" id="refund-target-order-id">
        <input type="hidden" id="refund-preview-token">

        <!-- 취소/환불 범위 선택 라디오 -->
        <div style="background:#faf8f5; padding:10px 14px; border-radius:8px; border:1px solid #f0e6d8; margin-bottom:1rem;">
            <label style="font-size:0.85rem; font-weight:700; color:#4a3b32; display:block; margin-bottom:6px;">취소 및 환불 범위 선택</label>
            <div style="display:flex; gap:16px; font-size:0.88rem;">
                <label style="cursor:pointer; display:flex; align-items:center; gap:4px; font-weight:600; color:#2c3e50;">
                    <input type="radio" name="refund_scope" id="refund-scope-full" value="FULL" checked onchange="handleRefundScopeChange('FULL')">
                    전체 주문 취소 (전액 환불)
                </label>
                <label id="lbl-refund-scope-partial" style="cursor:pointer; display:flex; align-items:center; gap:4px; font-weight:600; color:#2c3e50;">
                    <input type="radio" name="refund_scope" id="refund-scope-partial" value="PARTIAL" onchange="handleRefundScopeChange('PARTIAL')">
                    선택 상품 취소 (부분 환불)
                </label>
            </div>
            <div id="refund-scope-warning-msg" style="font-size:0.78rem; color:#b84a4a; margin-top:4px; display:none;">
                * 일부 상품이 이미 출고되어 전체 취소할 수 없습니다. (선택 상품 취소만 가능)
            </div>
        </div>

        <!-- 선택 상품 수량 조절 테이블 영역 -->
        <div id="refund-items-selection-container" style="display:none; max-height:180px; overflow-y:auto; background:#fff; border:1px solid #ddd; border-radius:8px; padding:10px; margin-bottom:1rem;">
            <!-- JS 동적 생성 -->
        </div>

        <!-- 서버 실시간 미리보기 금액 렌더링 카드 -->
        <div id="refund-preview-body" style="font-size:0.88rem; line-height:1.6; background:#fff8f8; padding:12px 16px; border-radius:8px; border:1px solid #ffcdd2; margin-bottom:1rem;">
            <p style="margin:0; color:#777; text-align:center;">환불 예상 금액을 계산 중입니다...</p>
        </div>

        <!-- 취소 / 환불 사유 선택 -->
        <div class="form-group" style="margin-bottom:1rem;">
            <label style="font-weight:600; color:#b84a4a; font-size:0.85rem;">취소 및 환불 사유 선택 / 입력 <span style="color:#d32f2f;">*</span></label>
            <select id="refund-reason-code" class="form-control" style="margin-bottom:6px; font-size:0.85rem; padding:6px 10px;">
                <option value="CUSTOMER_REQUEST">고객변심 / 요청</option>
                <option value="OUT_OF_STOCK">재고부족 / 품절</option>
                <option value="SHIPPING_DELAY">배송지연</option>
                <option value="DEFECTIVE_PRODUCT">상품하자 / 이물질</option>
                <option value="ADMIN_MANUAL">관리자 직권 취소</option>
            </select>
            <input type="text" id="refund-reason-custom" class="form-control" placeholder="상세 사유 입력 (선택사항)" style="font-size:0.85rem; padding:6px 10px;">
        </div>

        <div id="refund-confirm-modal-notice" style="font-size:0.78rem; color:#b84a4a; margin-bottom:1.2rem; background:#fffdfa; padding:8px 10px; border-radius:6px; border:1px solid #fce8e6;">
            <i class="fa-solid fa-shield-halved" style="margin-right:3px;"></i> 실행 시 PortOne PG 취소 및 상품 재고 멱등 보상이 즉시 진행되며, 취소된 결제는 복구할 수 없습니다.
        </div>

        <div style="text-align:right; gap:8px; display:flex; justify-content:flex-end;">
            <button onclick="closeModal('adminRefundConfirmModal')" class="btn-action btn-action-secondary">취소</button>
            <button id="btn-execute-final-refund" onclick="executeFinalAdminRefund(this)" class="btn-action btn-action-danger">최종 환불 승인 실행</button>
        </div>
    </div>
</div>
