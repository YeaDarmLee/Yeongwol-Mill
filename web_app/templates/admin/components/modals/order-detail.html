<!-- 주문 상세 통합 관리 모달 -->
<div id="orderDetailModal" class="modal-overlay">
    <div class="modal-card" style="max-width: 920px; max-height: 88vh; overflow-y: auto; padding: 2rem;">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--admin-primary, #8D6E63); padding-bottom:0.8rem; margin-bottom:1.2rem;">
            <h3 style="margin:0; font-family:'Noto Serif KR', serif; color:#2c3e50; font-size:1.25rem;">주문 상세</h3>
            <button type="button" onclick="closeModal('orderDetailModal')" style="background:none; border:none; font-size:1.5rem; cursor:pointer; color:#888;">&times;</button>
        </div>
        <div id="admin-order-modal-body">
            <p style="text-align:center; color:#777; padding:2rem;">주문 상세 데이터를 불러오는 중...</p>
        </div>
        <div id="admin-order-modal-footer" style="display:flex; justify-content:flex-end; align-items:center; gap:10px; margin-top:1.5rem; border-top:1px solid #eee; padding-top:1rem;">
            <button onclick="closeModal('orderDetailModal')" class="btn-action btn-action-secondary">닫기</button>
        </div>
    </div>
</div>
