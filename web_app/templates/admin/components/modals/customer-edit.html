<!-- 회원 정보 수정 모달 -->
<div id="editCustomerModal" class="modal-overlay">
    <div class="modal-card" style="max-width:500px;">
        <h3 style="font-family:'Noto Serif KR', serif; margin-top:0;">회원 정보 수정 및 비밀번호 초기화</h3>
        <input type="hidden" id="edit-cust-id">
        <div class="form-group">
            <label>회원 이름</label>
            <input type="text" id="edit-cust-name" class="form-control" placeholder="예: 홍길동" required>
        </div>
        <div class="form-group">
            <label>이메일 주소</label>
            <input type="email" id="edit-cust-email" class="form-control" placeholder="user@example.com" required>
        </div>
        <div class="form-group">
            <label>연락처 (전화번호)</label>
            <input type="text" id="edit-cust-phone" class="form-control" placeholder="010-0000-0000">
        </div>
        <div class="form-group">
            <label>계정 상태</label>
            <select id="edit-cust-status" class="form-control">
                <option value="ACTIVE">정상 활동 (ACTIVE)</option>
                <option value="SUSPENDED">계정 정지 (SUSPENDED)</option>
            </select>
        </div>
        <div class="form-group" style="background:#faf8f5; padding:12px; border-radius:8px; border:1px solid #ebe6df;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
                <label style="margin:0; font-weight:600; color:#2c3e50;">비밀번호 변경 / 초기화</label>
                <button type="button" class="btn-action btn-action-secondary" style="font-size:0.75rem; padding:2px 8px;" onclick="generateTempPassword()">임시 비밀번호 생성</button>
            </div>
            <input type="text" id="edit-cust-newpass" class="form-control" placeholder="새 비밀번호 입력 (미입력 시 기존 비밀번호 유지)">
        </div>
        <div style="text-align:right; gap:8px; display:flex; justify-content:flex-end; margin-top:1.5rem;">
            <button onclick="closeModal('editCustomerModal')" class="btn-action btn-action-secondary">취소</button>
            <button onclick="submitEditCustomer(this)" class="btn-action btn-action-primary">수정 사항 저장</button>
        </div>
    </div>
</div>
