<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 시스템 - 영월고향방앗간</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/admin/css/admin.css">
</head>

<body>

    <!-- 1. 관리자 로그인 폼 마운트 지점 -->
    <div id="login-container" style="display:flex; width:100%; min-height:100vh; align-items:center; justify-content:center;"></div>

    <!-- 2. 멀티 페이지 관리자 레이아웃 -->
    <div id="admin-app" class="admin-layout" style="display:none;">
        <!-- 사이드바 네비게이션 마운트 지점 -->
        <div id="sidebar-container" style="display:contents;"></div>

        <!-- 메인 콘텐츠 영역 (동적 페이지 뷰 마운트) -->
        <main class="main-content" id="main-content">
        </main>
    </div>

    <!-- 3. 모달 팝업 마운트 지점 -->
    <div id="modal-container"></div>

    <!-- 분리된 페이지/모듈 JS 로드 -->
    <script src="/static/admin/js/admin-core.js"></script>
    <script src="/static/admin/js/dashboard.js"></script>
    <script src="/static/admin/js/orders.js"></script>
    <script src="/static/admin/js/products.js"></script>
    <script src="/static/admin/js/customers.js"></script>
    <script src="/static/admin/js/audit.js"></script>
    <script src="/static/legal_modal.js"></script>

</body>

</html>
