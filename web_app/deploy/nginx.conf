# Nginx Configuration for 영월고향방앗간 (SSL & Reverse Proxy)
server {
    listen 80;
    server_name yeongwol-mill.com www.yeongwol-mill.com;

    # HTTP ➔ HTTPS Redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yeongwol-mill.com www.yeongwol-mill.com;

    # Certbot Let's Encrypt SSL
    ssl_certificate /etc/letsencrypt/live/yeongwol-mill.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yeongwol-mill.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/yeongwol_access.log;
    error_log /var/log/nginx/yeongwol_error.log;

    # Static Media Files
    location /static/ {
        alias /var/www/yeongwol-mill/web_app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Gunicorn App Reverse Proxy
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
