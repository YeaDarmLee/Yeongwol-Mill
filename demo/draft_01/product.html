<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 상세 - 영월방앗간</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .product-detail-container {
            max-width: 1100px;
            margin: 4rem auto 8rem;
            padding: 0 5%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
        }

        .product-gallery {
            background-color: #f8f6f2;
            border-radius: 16px;
            padding: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .product-gallery img {
            width: 85%;
            height: auto;
            max-height: 400px;
            object-fit: contain;
        }

        .product-purchase-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .product-category-tag {
            color: var(--color-primary, #915a28);
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .product-title {
            font-family: 'Noto Serif KR', serif;
            font-size: 2.2rem;
            margin-bottom: 1rem;
            color: #222;
        }

        .product-desc {
            color: #666;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            font-size: 1.05rem;
        }

        .product-price {
            font-family: 'Noto Serif KR', serif;
            font-size: 2rem;
            font-weight: 700;
            color: #111;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #eee;
        }

        .option-group {
            margin-bottom: 1.5rem;
        }

        .option-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .quantity-control {
            display: inline-flex;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
        }

        .quantity-btn {
            background: #f5f5f5;
            border: none;
            width: 38px;
            height: 38px;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .quantity-input {
            width: 50px;
            height: 38px;
            border: none;
            text-align: center;
            font-size: 1rem;
            font-weight: 600;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn-cart {
            flex: 1;
            padding: 1.1rem;
            border: 1px solid var(--color-primary, #915a28);
            background: white;
            color: var(--color-primary, #915a28);
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-cart:hover {
            background: #fdfaf6;
        }

        .btn-buy {
            flex: 1;
            padding: 1.1rem;
            border: none;
            background: var(--color-primary, #915a28);
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-buy:hover {
            background: #7a4a1f;
        }

        @media (max-width: 768px) {
            .product-detail-container {
                grid-template-columns: 1fr;
                gap: 2rem;
                margin-top: 2rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="nav-overlay"></div>
        <a href="index.html" class="logo">영월방앗간</a>
        <div class="nav-container">
            <nav class="gnb">
                <a href="index.html">홈</a>
                <a href="brand.html">브랜드 소개</a>
                <a href="process.html">생산과정</a>
                <a href="category.html">상품보기</a>
            </nav>
            <div class="utility">
                <a href="login.html">로그인</a>
                <a href="order-history.html">주문조회</a>
                <a href="cart.html" id="cart-nav">장바구니 (0)</a>
            </div>
        </div>
    </header>

    <main class="product-detail-container" id="productDetail">
        <p style="grid-column: 1/-1; text-align: center; padding: 4rem;">상품 정보를 불러오는 중입니다...</p>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-info">
                <span class="footer-logo">영월방앗간</span><br>
                강원도 영월군 영월읍 방앗간길 123<br>
                대표자: 홍길동 | 사업자등록번호: 123-45-67890<br>
                고객센터: 1588-0000 (평일 09:00 - 18:00)
            </div>
            <div class="footer-links">
                <a href="#">이용약관</a>
                <a href="#">개인정보처리방침</a>
            </div>
        </div>
        <div class="copyright">&copy; 2026 영월방앗간. All rights reserved.</div>
    </footer>

    <script src="cart.js"></script>
    <script>
        let currentProduct = null;
        let quantity = 1;

        async function loadProductDetail() {
            const params = new URLSearchParams(window.location.search);
            const productId = params.get('id') || '1'; // 기본값 1번 상품

            const container = document.getElementById('productDetail');
            try {
                const response = await fetch(`/api/products/${productId}`);
                if (!response.ok) throw new Error("Product not found");

                const data = await response.json();
                currentProduct = data.product;

                container.innerHTML = `
                    <div class="product-gallery">
                        <img src="${currentProduct.image_url}" alt="${currentProduct.name}">
                    </div>
                    <div class="product-purchase-info">
                        <span class="product-category-tag">${currentProduct.category_name}</span>
                        <h1 class="product-title">${currentProduct.name}</h1>
                        <p class="product-desc">${currentProduct.description}</p>
                        <div class="product-price">${Number(currentProduct.price).toLocaleString()}원</div>

                        <div class="option-group">
                            <label>용량 / 규격</label>
                            <div style="padding: 0.8rem; background: #f9f9f9; border-radius: 6px; font-weight: 500;">
                                ${currentProduct.capacity || '기본 규격'}
                            </div>
                        </div>

                        <div class="option-group">
                            <label>수량</label>
                            <div class="quantity-control">
                                <button class="quantity-btn" onclick="changeQty(-1)">-</button>
                                <input type="text" class="quantity-input" id="qtyInput" value="1" readonly>
                                <button class="quantity-btn" onclick="changeQty(1)">+</button>
                            </div>
                        </div>

                        <div class="action-buttons">
                            <button class="btn-cart" onclick="handleAddToCart()">장바구니 담기</button>
                            <button class="btn-buy" onclick="handleDirectBuy()">바로 구매하기</button>
                        </div>
                    </div>
                `;
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: red; padding: 4rem;">상품 정보를 찾을 수 없습니다.</p>';
            }
        }

        function changeQty(delta) {
            quantity = Math.max(1, quantity + delta);
            const input = document.getElementById('qtyInput');
            if (input) input.value = quantity;
        }

        function handleAddToCart() {
            if (!currentProduct) return;
            addToCart({
                id: currentProduct.id,
                name: currentProduct.name,
                price: currentProduct.price,
                capacity: currentProduct.capacity,
                image_url: currentProduct.image_url,
                quantity: quantity
            }, true);
        }

        function handleDirectBuy() {
            if (!currentProduct) return;
            // 바로구매용 임시 장바구니 세팅 후 checkout 이동
            const checkoutItems = [{
                id: currentProduct.id,
                name: currentProduct.name,
                price: currentProduct.price,
                capacity: currentProduct.capacity,
                image_url: currentProduct.image_url,
                quantity: quantity
            }];
            localStorage.setItem('yw_checkout_items', JSON.stringify(checkoutItems));
            window.location.href = 'checkout.html';
        }

        document.addEventListener('DOMContentLoaded', loadProductDetail);
    </script>
</body>
</html>
