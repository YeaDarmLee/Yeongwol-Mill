<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장바구니 - 영월고향방앗간</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .cart-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            margin-top: 40px;
        }

        .cart-items {
            flex: 2;
            min-width: 300px;
        }

        .cart-summary {
            flex: 1;
            min-width: 300px;
            position: sticky;
            top: 40px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            font-size: 15px;
        }

        .summary-total {
            font-size: 24px;
            font-weight: 700;
            color: var(--color-primary-dark);
            margin-top: 16px;
            padding-top: 16px;
            border-top: 2px solid var(--color-primary);
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">영월고향방앗간</a>
            <button class="hamburger" id="hamburger-menu" aria-label="메뉴 열기">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="nav-wrapper" id="nav-wrapper">
                <nav class="nav-links">
                    <a href="index.html">홈</a>
                    <a href="brand.html">브랜드 소개</a>
                    <a href="process.html">생산과정</a>
                    <a href="products.html">상품보기</a>
                </nav>
                <div class="header-actions">
                    <a href="login.html">로그인</a>
                    <a href="cart.html">장바구니</a>
                </div>
            </div>
        </div>
    </header>

    <main class="section container">
        <h1 class="font-serif" style="text-align: center; margin-bottom: 40px; font-size: 32px;">장바구니</h1>

        <div class="cart-wrapper" id="cart-content">
            <!-- 장바구니 내용은 아래 자바스크립트로 렌더링됩니다 -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-info">
                <span class="footer-logo">영월고향방앗간</span>
                강원도 영월군 영월읍 하송로 123<br>
                대표자: 이영월 | 사업자등록번호: 123-45-67890<br>
                통신판매업신고: 2026-강원영월-0123<br>
                고객센터: 033-123-4567 (평일 09:00 - 18:00)
            </div>
            <div class="footer-links">
                <a href="#">이용약관</a>
                <a href="#">개인정보처리방침</a>
                <a href="#">입점문의</a>
            </div>
        </div>
        <div class="copyright">
            &copy; 2026 영월고향방앗간. All rights reserved.
        </div>
    </footer>
    <script src="cart.js"></script>
    <script>
        function renderCart() {
            const cartContent = document.getElementById('cart-content');
            let cart = JSON.parse(localStorage.getItem('yw_cart')) || [];

            if (cart.length === 0) {
                cartContent.innerHTML = `
                    <div style="width: 100%; text-align: center; padding: 100px 0;">
                        <p style="font-size: 18px; color: var(--color-text-muted); margin-bottom: 24px;">장바구니에 담긴 상품이 없습니다.</p>
                        <a href="products.html" class="btn btn-primary">상품 보러가기</a>
                    </div>
                `;
                return;
            }

            let itemsHTML = `<div class="cart-items"><div style="border-top: 2px solid var(--color-primary-dark);">`;
            let totalPrice = 0;

            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                totalPrice += itemTotal;

                itemsHTML += `
                    <div class="cart-item" style="display: flex; align-items: center; padding: 24px 0; border-bottom: 1px solid rgba(125,155,139,0.3);">
                        <img src="${item.img}" alt="${item.name}" class="cart-item-img" style="width: 100px; height: 100px; object-fit: cover; border-radius: 12px; margin-right: 24px;">
                        <div class="cart-item-info" style="flex: 1;">
                            <h3 style="font-size: 18px; margin-bottom: 8px;">${item.name}</h3>
                            <p style="color: var(--color-text-muted); font-size: 14px; margin-bottom: 16px;">옵션: ${item.option}</p>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span style="font-size: 14px; color: var(--color-text-main);">수량: ${item.quantity}개</span>
                            </div>
                        </div>
                        <div style="font-size: 18px; font-weight: 500; color: var(--color-primary-dark); min-width: 100px; text-align: right;">${itemTotal.toLocaleString()}원</div>
                        <button onclick="removeFromCart(${index})" style="background: none; border: none; font-size: 24px; color: var(--color-text-muted); cursor: pointer; margin-left: 24px; padding: 8px;">&times;</button>
                    </div>
                `;
            });

            itemsHTML += `</div></div>`;

            const deliveryFee = totalPrice >= 50000 ? 0 : 3000;
            const finalPrice = totalPrice + deliveryFee;

            const summaryHTML = `
            <div class="cart-summary">
                <div class="card" style="padding: 32px; border-radius: 24px; background-color: var(--color-bg-white); box-shadow: var(--shadow-soft); border: 1px solid rgba(125,155,139,0.1);">
                    <h3 class="font-serif" style="margin-bottom: 24px; font-size: 22px;">결제 정보</h3>
                    <div class="summary-row" style="display: flex; justify-content: space-between; margin-bottom: 16px; font-size: 15px;">
                        <span style="color: var(--color-text-main);">상품 합계</span>
                        <span style="font-weight: 500;">${totalPrice.toLocaleString()}원</span>
                    </div>
                    <div class="summary-row" style="display: flex; justify-content: space-between; margin-bottom: 16px; font-size: 15px;">
                        <span style="color: var(--color-text-main);">배송비</span>
                        <span style="font-weight: 500;">${deliveryFee === 0 ? '0원 (무료배송)' : deliveryFee.toLocaleString() + '원'}</span>
                    </div>
                    <div class="summary-total" style="display: flex; justify-content: space-between; font-size: 24px; font-weight: 700; color: var(--color-primary-dark); margin-top: 16px; padding-top: 16px; border-top: 2px solid var(--color-primary);">
                        <span>총 결제금액</span>
                        <span>${finalPrice.toLocaleString()}원</span>
                    </div>
                    
                    <button onclick="alert('결제 기능은 데모 환경에서 지원하지 않습니다.')" class="btn btn-primary" style="width: 100%; margin-top: 32px; padding: 18px; font-size: 18px; border: none; cursor: pointer;">결제하기</button>
                </div>
            </div>
            `;

            cartContent.innerHTML = itemsHTML + summaryHTML;
        }

        function removeFromCart(index) {
            let cart = JSON.parse(localStorage.getItem('yw_cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('yw_cart', JSON.stringify(cart));
            updateCartCount();
            renderCart();
        }

        document.addEventListener('DOMContentLoaded', renderCart);
    </script>
</body>

</html>
